name: Test & build Android APK

on:
  push:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  test:
    name: Bot simulation test
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Import project
        run: godot --headless --import || true
      - name: Run simulation
        run: |
          godot --headless --fixed-fps 60 res://tests/sim_test.tscn -- mode=smoke stages=1,2 2>&1 | tee sim.log
          if grep -E "SCRIPT ERROR|^ERROR" sim.log; then echo "Errors found"; exit 1; fi
          grep -q "^WINS" sim.log

  android:
    name: Export debug APK
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Move Godot templates and editor settings into $HOME
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/ ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Import project
        run: godot --headless --import || true
      - name: Export APK
        run: |
          mkdir -v -p build/android
          godot --headless --export-debug "Android" "$(readlink -f build)/android/wyrmbreaker.apk"
          ls -la build/android
          test -f build/android/wyrmbreaker.apk
      - uses: actions/upload-artifact@v4
        with:
          name: wyrmbreaker-debug-apk
          path: build/android/wyrmbreaker.apk
